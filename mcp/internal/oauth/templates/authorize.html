<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Authorize {{.ClientName}} - httpSMS</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
  <h1>{{.ClientName}} wants to access your httpSMS account</h1>
  <p>Signing in will let {{.ClientName}} do the following:</p>
  <ul>
    {{range .Scopes}}<li>{{.Description}}</li>{{end}}
  </ul>

  <!--
    The only form that is ever submitted to this service carries the
    transaction ID, the Firebase ID token, and the approved scopes. The
    email and password fields below deliberately live outside it: those
    credentials are sent to Firebase by the browser SDK and must never
    reach this server.
  -->
  <form id="httpsms-authorize-form" method="POST" action="/oauth/firebase/complete">
    <input type="hidden" name="transaction_id" value="{{.TransactionID}}">
    <input type="hidden" name="id_token" id="httpsms-id-token" value="">
    {{range .Scopes}}<input type="hidden" name="approved_scopes" value="{{.Value}}">{{end}}
  </form>

  <div id="httpsms-sign-in">
    <button type="button" id="httpsms-google-button">Sign in with Google to Allow</button>
    <button type="button" id="httpsms-github-button">Sign in with GitHub to Allow</button>

    <div id="httpsms-password-sign-in">
      <label for="httpsms-email">Email</label>
      <input type="email" id="httpsms-email" name="httpsms-email" autocomplete="username">
      <label for="httpsms-password">Password</label>
      <input type="password" id="httpsms-password" name="httpsms-password" autocomplete="current-password">
      <button type="button" id="httpsms-password-button">Sign in with email and password to Allow</button>
    </div>
  </div>

  <p id="httpsms-error" role="alert"></p>

  <form method="POST" action="/oauth/firebase/complete">
    <input type="hidden" name="transaction_id" value="{{.TransactionID}}">
    <input type="hidden" name="denied" value="1">
    <button type="submit" id="httpsms-deny-button">Deny</button>
  </form>

  <script>
    // The Firebase Web API key and auth domain below are ordinary public
    // browser-side configuration, not secrets: Firebase's security model
    // relies on server-side ID-token verification (performed by this
    // service's POST /oauth/firebase/complete handler), not on keeping
    // this configuration confidential.
    var firebaseConfig = {
      apiKey: "{{.FirebaseAPIKey}}",
      authDomain: "{{.FirebaseAuthDomain}}"
    };
    firebase.initializeApp(firebaseConfig);

    // The Firebase ID token is written only into a hidden form field and
    // submitted via a normal POST body -- it must never be appended to a
    // URL (query string, fragment, or otherwise), where it could leak
    // through browser history, a Referer header, or server access logs.
    // Every sign-in method below (Google, GitHub, and email/password)
    // funnels through this single completion path.
    function completeWithUser(user) {
      return user.getIdToken().then(function (idToken) {
        document.getElementById("httpsms-id-token").value = idToken;
        document.getElementById("httpsms-authorize-form").submit();
      });
    }

    function reportError(error) {
      document.getElementById("httpsms-error").textContent = "Sign-in failed: " + error.message;
    }

    function signInWithProvider(provider) {
      firebase.auth().signInWithPopup(provider).then(function (result) {
        return completeWithUser(result.user);
      }).catch(reportError);
    }

    document.getElementById("httpsms-google-button").addEventListener("click", function () {
      signInWithProvider(new firebase.auth.GoogleAuthProvider());
    });

    document.getElementById("httpsms-github-button").addEventListener("click", function () {
      signInWithProvider(new firebase.auth.GithubAuthProvider());
    });

    document.getElementById("httpsms-password-button").addEventListener("click", function () {
      var email = document.getElementById("httpsms-email").value;
      var password = document.getElementById("httpsms-password").value;

      firebase.auth().signInWithEmailAndPassword(email, password).then(function (result) {
        return completeWithUser(result.user);
      }).catch(reportError);
    });
  </script>
</body>
</html>
