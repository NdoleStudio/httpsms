version: 2
updates:
  # Fetch and update latest `npm` packages
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
      time: "00:00"
    # Keep version updates beyond pnpm's 24-hour release-age guard.
    # Security updates bypass cooldown; transitive resolution also needs the workspace gate.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    reviewers:
      - AchoArnold
    assignees:
      - AchoArnold
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
  # Fetch and update latest `github-actions` pkgs
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "00:00"
    open-pull-requests-limit: 10
    reviewers:
      - AchoArnold
    assignees:
      - AchoArnold
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
  # Fetch and update latest `go` packages
  - package-ecosystem: gomod
    directory: "/api"
    schedule:
      interval: monthly
      time: "00:00"
    open-pull-requests-limit: 10
    reviewers:
      - AchoArnold
    assignees:
      - AchoArnold
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
