services:
  cockroachdb:
    image: cockroachdb/cockroach:latest
    command: start-single-node --insecure --store=type=mem,size=640MiB
    ports:
      - "26257:26257"
      - "8081:8080"
    healthcheck:
      test:
        [
          "CMD",
          "cockroach",
          "sql",
          "--insecure",
          "--host=localhost",
          "--execute=SELECT 1;",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cockroachdb-init:
    image: cockroachdb/cockroach:latest
    depends_on:
      cockroachdb:
        condition: service_healthy
    entrypoint:
      [
        "cockroach",
        "sql",
        "--insecure",
        "--host=cockroachdb",
        "--execute=CREATE DATABASE IF NOT EXISTS httpsms;",
      ]
    restart: "no"

  redis:
    image: redis:latest
    command: redis-server
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: httpsms
      MONGO_INITDB_ROOT_PASSWORD: testpassword
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  wiremock:
    image: wiremock/wiremock:3x
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    networks:
      default:
        aliases:
          - wiremock.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  adapter-emulator:
    build:
      context: ./adapter-emulator
    ports:
      - "9092:9092"
    environment:
      API_BASE_URL: http://api:8000
      ADAPTER_TLS_CERT: /certs/server.pem
      ADAPTER_TLS_KEY: /certs/server-key.pem
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9092/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../api
    ports:
      - "8000:8000"
    depends_on:
      cockroachdb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      adapter-emulator:
        condition: service_healthy
    env_file:
      - .env.test
    environment:
      FIREBASE_CREDENTIALS: "${FIREBASE_CREDENTIALS}"
      # Delegated MCP authentication. The issuer matches the MCP service's
      # own public base URL (MCP_BASE_URL below), the audience matches the
      # API URL the MCP service is configured to call, and the JWKS document
      # is fetched over the Docker network rather than through the host port
      # mapping.
      MCP_AUTH_ISSUER: http://localhost:8082
      MCP_AUTH_AUDIENCE: http://api:8000
      MCP_AUTH_JWKS_URL: http://mcp:8080/.well-known/jwks.json
      SSL_CERT_FILE: /adapter-certs/ca.pem
    volumes:
      - ./certs/ca.pem:/adapter-certs/ca.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  mcp:
    build:
      context: ../mcp
    ports:
      - "8082:8080"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    env_file:
      # Only for REDIS_URL and ENV; every MCP-specific setting is declared
      # explicitly below so the MCP service's configuration is readable in
      # one place.
      - .env.test
    environment:
      PORT: "8080"
      # The base URL is the host-mapped URL, because it is also the issuer,
      # the RFC 8707 resource identifier ("<base>/mcp"), and the value
      # published in OAuth discovery metadata: every one of those must be
      # the URL an MCP client on the host actually connects to.
      MCP_BASE_URL: http://localhost:8082
      HTTPSMS_API_URL: http://api:8000
      API_AUDIENCE: http://api:8000
      FIREBASE_PROJECT_ID: httpsms-test
      FIREBASE_API_KEY: test-firebase-api-key
      FIREBASE_AUTH_DOMAIN: httpsms-test.firebaseapp.com
      # Deterministic, offline Firebase certificate endpoint: WireMock serves
      # the self-signed certificate generated alongside the signing key, so
      # the integration tests can mint Firebase ID tokens the MCP service
      # actually verifies (see generate-firebase-credentials.sh).
      FIREBASE_CERTS_URL: http://wiremock:8080/firebase-certs
      MCP_SIGNING_PRIVATE_KEY_FILE: /run/secrets/mcp-test-signing-key.pem
      MCP_SIGNING_KEY_ID: mcp-test-key
      # Rate-limit budgets sized for a suite that must be re-runnable against
      # a live stack: high enough that repeated full runs within the same
      # hour never trip a limit (an hourly window outlives a test run), low
      # enough that the dedicated rate-limit test still exhausts the hourly
      # create_phone_api_key budget in a couple of seconds. That test
      # authenticates as a brand-new Firebase UID on every attempt, so it
      # only ever spends its own untouched budget; KEY_CREATES_PER_HOUR is
      # mirrored by mcpKeyCreatesPerHour in mcp_integration_test.go.
      READ_TOOLS_PER_MINUTE: "240"
      SEND_TOOLS_PER_MINUTE: "30"
      KEY_CREATES_PER_HOUR: "40"
      KEY_ROTATIONS_PER_HOUR: "500"
    volumes:
      - ./mcp-test-signing-key.pem:/run/secrets/mcp-test-signing-key.pem:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  seed:
    image: cockroachdb/cockroach:latest
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./seed.sql:/seed.sql:ro
    entrypoint:
      [
        "cockroach",
        "sql",
        "--insecure",
        "--host=cockroachdb",
        "--database=httpsms",
        "--file=/seed.sql",
      ]
    restart: "no"
